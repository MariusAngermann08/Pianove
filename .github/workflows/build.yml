# Builds Pianove as a stand-alone app for Windows, macOS and Linux (pianove.spec).
# Every run uploads the three builds as artifacts; pushing a tag like v1.2.0 also
# attaches them to a GitHub release, so people can download Pianove without Python.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Pianove-Windows
          - os: macos-latest
            name: Pianove-macOS
          - os: ubuntu-22.04
            name: Pianove-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install fluid-synth

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfluidsynth3 libasound2-dev libjack-jackd2-dev libportaudio2

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests -q

      - name: Build
        run: pyinstaller pianove.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Pianove -DestinationPath ${{ matrix.name }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Pianove.app ${{ matrix.name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.name }}.tar.gz -C dist Pianove

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.*
