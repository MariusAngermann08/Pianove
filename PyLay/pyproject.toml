[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pylay"
version = "0.1.0"
description = "An iOS-inspired UI library for pygame with spring physics and reactive state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["pygame>=2.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pylay*"]

[tool.setuptools.package-data]
pylay = ["assets/*.ttf", "assets/fonts/*.ttf", "assets/fonts/*.codepoints", "py.typed"]
